$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Video
status: stable
description: 'Responsive video — an embed URL (YouTube/Vimeo) or a direct video file.'
category: Jarvis
props:
  type: object
  # video_url used to be required, back when it was the only way to give this
  # component a video. Now that a Remote video media pick can supply the source,
  # requiring the URL too would make the media-only case fail validation — and a
  # required prop can only bind to a required field anyway. Neither is required;
  # the template renders nothing when both are empty.
  properties:
    video_media:
      title: 'Remote video'
      description: 'Pick a Remote video (YouTube/Vimeo) from the media library, or add a new one there. Takes precedence over the URL below. Deliberately NOT the local Video media type — this component embeds hosted players.'
      type: string
      format: uri-reference
      # Marker read by JarvisCanvasHooks::canvasStorablePropShapeAlter(), which
      # swaps the autocomplete Canvas would otherwise give us for the media
      # library and narrows the bundles to the site's oEmbed video types.
      x-jarvis-remote-video: true
    video_url:
      title: 'Video URL'
      description: 'YouTube/Vimeo embed URL, or a direct .mp4/.webm file URL.'
      type: string
      format: uri-reference
      examples:
        - 'https://www.youtube.com/embed/aqz-KE-bpKQ'
        - '/sites/default/files/demo.mp4'
    title:
      title: 'Accessible title'
      description: 'Describes the video for screen-reader users (iframe title attribute).'
      type: string
      examples:
        - 'Product demo video'
    captions_url:
      title: 'Captions file URL (files only)'
      description: 'WebVTT (.vtt) captions track for direct video files — required for WCAG when the video has speech. YouTube/Vimeo embeds use their own captions.'
      type: string
      format: uri-reference
      examples:
        - '/sites/default/files/demo.vtt'
    captions_lang:
      title: 'Captions language code'
      type: string
      default: 'en'
      examples:
        - 'en'
    aspect:
      title: 'Aspect ratio'
      type: string
      enum: ['16x9', '4x3', '21x9']
      'meta:enum':
        '16x9': '16:9'
        '4x3': '4:3'
        '21x9': '21:9'
      default: '16x9'
      examples:
        - '16x9'
    full_width:
      title: 'Full width'
      type: boolean
      default: false
      examples:
        - false
    autoplay:
      title: 'Autoplay (files only)'
      type: boolean
      default: false
      examples:
        - false
    muted:
      title: 'Muted (files only)'
      type: boolean
      default: false
      examples:
        - false
    padding:
      title: Padding
      type: string
      enum: [none, all, top, bottom, left, right]
      'meta:enum':
        none: None
        all: 'All sides'
        top: Top
        bottom: Bottom
        left: Left
        right: Right
      default: none
    padding_size:
      title: 'Padding size'
      type: string
      enum: [small, medium, large]
      'meta:enum':
        small: 'Small (10px)'
        medium: 'Medium (20px)'
        large: 'Large (30px)'
      default: medium
    margin:
      title: Margin
      type: string
      enum: [none, all, top, bottom, left, right]
      'meta:enum':
        none: None
        all: 'All sides'
        top: Top
        bottom: Bottom
        left: Left
        right: Right
      default: none
    margin_size:
      title: 'Margin size'
      type: string
      enum: [small, medium, large]
      'meta:enum':
        small: 'Small (10px)'
        medium: 'Medium (20px)'
        large: 'Large (30px)'
      default: medium
    vertical_padding:
      title: 'Vertical padding (30px)'
      type: boolean
      default: false
