$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: '3 Columns'
status: stable
description: 'Three columns on desktop, two on tablet, stacked full-width on mobile.'
category: 'Jarvis Layout'
libraryOverrides:
  dependencies:
    - jarvis/contrast
    - jarvis/reveal
props:
  type: object
  properties:
    width:
      title: 'Section width'
      type: string
      enum: [boxed, full]
      'meta:enum':
        boxed: 'Boxed (centred)'
        full: 'Full width'
      default: boxed
    background:
      title: 'Background colour'
      type: string
      enum: [none, primary, secondary, bg1, bg2, dark, light, image]
      'meta:enum':
        none: None
        primary: Primary
        secondary: Secondary
        bg1: 'Background 1'
        bg2: 'Background 2'
        dark: 'Dark (#1a1a1a)'
        light: 'Light (#f5f5f5)'
        image: 'Image (select below)'
      default: none
      examples:
        - none
    background_image:
      title: 'Background image'
      $ref: json-schema-definitions://canvas.module/image
    overlay:
      title: 'Image overlay opacity (%)'
      type: integer
      minimum: 0
      maximum: 100
      default: 45
    text_color:
      title: 'Text colour (overrides child components)'
      description: 'Ignored on Background 1 and Background 2. Those are arbitrary theme-setting colours, so the text colour there is computed automatically to meet WCAG AA contrast and cannot be overridden.'
      type: string
      enum: [inherit, primary, secondary, black, white]
      'meta:enum':
        inherit: Default
        primary: Primary
        secondary: Secondary
        black: Black
        white: White
      default: inherit
      examples:
        - inherit
    gap:
      title: 'Column gap'
      type: string
      enum: [none, small, normal, large]
      'meta:enum':
        none: None
        small: Small
        normal: Normal
        large: Large
      default: normal
      examples:
        - normal
    padding:
      title: Padding
      type: string
      enum: [none, all, top, bottom, left, right]
      'meta:enum':
        none: None
        all: 'All sides'
        top: Top
        bottom: Bottom
        left: Left
        right: Right
      default: none
    padding_size:
      title: 'Padding size'
      type: string
      enum: [small, medium, large]
      'meta:enum':
        small: 'Small (10px)'
        medium: 'Medium (20px)'
        large: 'Large (30px)'
      default: medium
    margin:
      title: Margin
      type: string
      enum: [none, all, top, bottom, left, right]
      'meta:enum':
        none: None
        all: 'All sides'
        top: Top
        bottom: Bottom
        left: Left
        right: Right
      default: none
    margin_size:
      title: 'Margin size'
      type: string
      enum: [small, medium, large]
      'meta:enum':
        small: 'Small (10px)'
        medium: 'Medium (20px)'
        large: 'Large (30px)'
      default: medium
    vertical_padding:
      title: 'Vertical padding (30px)'
      type: boolean
      default: false
    animation:
      title: 'Scroll animation'
      description: 'Fades the section in as it scrolls into view. Honours the reduced-motion browser setting.'
      type: string
      enum: [none, right, left]
      'meta:enum':
        none: None
        right: 'Fade from right'
        left: 'Fade from left'
      default: none
      examples:
        - none
slots:
  first:
    title: 'Column 1'
    description: 'First column.'
  second:
    title: 'Column 2'
    description: 'Second column.'
  third:
    title: 'Column 3'
    description: 'Third column.'
